name: NodeJS with Webpack

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./dev.db
      JWT_SECRET: super_secure_jwt_secret_key_123
      DEFAULT_ADMIN_PASSWORD: admin
      VITE_API_URL: https://localhost:5000

    strategy:
      matrix:
        node-version: [24.x]

    defaults:
      run:
        working-directory: App

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install mkcert
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3-tools

          curl -sSL "https://dl.filippo.io/mkcert/latest?for=linux/amd64" \
            -o "$RUNNER_TEMP/mkcert"

          chmod +x "$RUNNER_TEMP/mkcert"
          sudo install -m 0755 "$RUNNER_TEMP/mkcert" /usr/local/bin/mkcert

      - name: Generate localhost certificates
        run: |
          mkdir -p certs
          mkcert -install
          mkcert \
            -cert-file certs/localhost.pem \
            -key-file certs/localhost-key.pem \
            localhost 127.0.0.1 ::1

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm run tests

      - name: Build frontend
        run: npm run build --prefix frontend
